site_name: release-signer API
site_description: Dokumentasi API release-signer, tool penandatanganan dan verifikasi software release.
repo_url: https://github.com/brii26/release-signer
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Referensi CLI: cli.md
  - Format data: formats.md
  - Status dan exit code: status.md
  - Contoh penggunaan: examples.md
  - Signed SBOM: sbom.md
  - Analisis keamanan: security.md
  - Referensi modul Go:
      - profile: api/pkg/profile.md
      - keys: api/pkg/keys.md
      - sigalg: api/pkg/sigalg.md
      - strictjson: api/pkg/strictjson.md
      - b64: api/pkg/b64.md
      - manifest: api/pkg/manifest.md
      - bundle: api/pkg/bundle.md
      - truststore: api/pkg/truststore.md
      - release: api/pkg/release.md
      - sbom: api/pkg/sbom.md
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
